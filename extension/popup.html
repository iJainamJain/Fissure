<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, Segoe UI, sans-serif; width: 320px; margin: 0; padding: 14px; color: #1a1a1a; }
  h1 { font-size: 15px; margin: 0 0 2px; color: #12233b; }
  .sub { font-size: 11px; color: #667; margin-bottom: 10px; }
  .url { font-family: ui-monospace, monospace; font-size: 11px; background: #f1f3f5; padding: 6px 8px;
         border-radius: 6px; word-break: break-all; margin-bottom: 10px; }
  label { font-size: 12px; display: block; margin: 8px 0 3px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; font-size: 12px; }
  .auth { font-size: 12px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px;
          padding: 8px; margin: 10px 0; }
  button { width: 100%; padding: 8px; font-size: 13px; font-weight: 600; color: #fff; background: #12233b;
           border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { background: #9aa5b1; cursor: not-allowed; }
  #status { font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  a { color: #1b6ec2; }
</style>
</head>
<body>
  <h1>🔎 Fissure</h1>
  <div class="sub">Scan the current page — authorized use only.</div>

  <div class="url" id="url">(reading tab…)</div>

  <label>Local server</label>
  <input type="text" id="server" value="http://127.0.0.1:8750">
  <label>Bearer token (from the Fissure server console)</label>
  <input type="text" id="token" placeholder="paste token">

  <div class="auth">
    <label style="margin:0"><input type="checkbox" id="authorize">
      I am authorized to security-test this target.</label>
  </div>

  <button id="scan" disabled>Scan this page</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
